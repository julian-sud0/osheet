name: Build & Deploy to Pages

on:
  push:
    branches: [claude/bowel-tracker-ux-jbm1w]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        # --legacy-peer-deps required: expo-asset / expo-web-browser pull a
        # peer set npm 10 considers conflicting; same flag we use locally.
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Build web bundle
        run: npm run build:web

      - name: Add .nojekyll
        # GitHub Pages strips files starting with _ unless Jekyll is disabled.
        # Expo emits _expo/ for static assets — without this, every JS file 404s.
        run: touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
